[Options]
frameless_window=@ByteArray(true)
hide_tabs=true
hide_toolbar=true
tabs=&clipboard

[Theme]
alt_bg=#1e1611
bg=#0d0906
css="\n    QMenuBar { max-height: 0px; min-height: 0px; border: none; padding: 0px; margin: 0px; font-size: 0px; color: #0d0906; background: #0d0906; }\n    QMenuBar::item { background: #0d0906; color: #0d0906; padding: 0px; margin: 0px; }\n    QMenu { background-color: #0d0906; color: #ffffff; border: 1px solid #ffb347; }\n    QMenu::item:selected { background-color: #ffb347; color: #0d0906; }\n    QToolBar { max-height: 0px; border: none; padding: 0px; margin: 0px; }\n    QToolButton { background-color: #0d0906; color: #ffffff; border: none; }\n    QTabBar::tab { background-color: #1e1611; color: #ffffff; padding: 4px 8px; border: none; }\n    QTabBar::tab:selected { background-color: #0d0906; color: #ffb347; }\n    QScrollBar:vertical { background: #0d0906; width: 8px; margin: 0px 0 0px 0; }\n    QScrollBar::handle:vertical { background: #1e1611; min-height: 20px; border-radius: 4px; }\n    QScrollBar::add-line:vertical, QScrollBar::sub-line:vertical { background: none; border: none; }\n    QScrollBar:horizontal { background: #0d0906; height: 8px; margin: 0px 0 0px 0; }\n    QScrollBar::handle:horizontal { background: #1e1611; min-width: 20px; border-radius: 4px; }\n    QScrollBar::add-line:horizontal, QScrollBar::sub-line:horizontal { background: none; border: none; }\n"
edit_bg=#1e1611
edit_fg=#ffffff
fg=#ffffff
find_bg=#ffb347
find_fg=#0d0906
font_antialiasing=true
icon_size=16
item_spacing=6
notes_bg=#1e1611
notes_fg=#ffffff
notification_bg=#1e1611
notification_fg=#ffffff
num_fg=#ffb347
num_margin=4
sel_bg=#ffb347
sel_fg=#0d0906
show_number=true
show_scrollbars=false

1\Command="copyq:\nvar rows = selectedItems();\nvar row = (rows.length > 0) ? rows[0] : currentItem();\nvar item = getItem(row);\nvar img = null;\nfor (var m in item) {\n    if (m.indexOf('image/') === 0) {\n        img = item[m];\n        break;\n    }\n}\nif (img) {\n    var tmp = Dir().tempPath() + '/copyq_ocr_' + Date.now() + '.png';\n    var file = File(tmp);\n    file.openWriteOnly();\n    file.write(img);\n    file.close();\n    var res = execute('tesseract', tmp, 'stdout', '-l', 'eng');\n    File(tmp).remove();\n    var text = str(res.stdout);\n    text = text ? text.trim() : '';\n    if (text && text.length > 0) {\n        add(text);\n        select(0);\n        execute('dunstify', '-a', 'osd', '-r', '9999', '📝 OCR TEXT EXTRACTED', text.length > 60 ? text.substring(0, 60) + '...' : text);\n    } else {\n        execute('dunstify', '-a', 'osd', '-r', '9999', '⚠️ OCR: NO TEXT FOUND', 'Could not detect readable text in screenshot.');\n    }\n} else {\n    execute('dunstify', '-a', 'osd', '-r', '9999', '⚠️ OCR ERROR', 'Selected item is not an image.');\n}\n"
1\Icon=📝
1\InMenu=true
1\Input=image/png
1\InternalId=custom_ocr_extract
1\Match=[object Object]
1\Name=Extract Text (OCR)
1\Shortcut=ctrl+o, o
1\Window=[object Object]

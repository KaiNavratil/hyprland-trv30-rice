2\Command="copyq:\nvar rows = selectedItems();\nvar row = (rows.length > 0) ? rows[0] : currentItem();\nvar item = getItem(row);\nvar img = null;\nfor (var m in item) {\n    if (m.indexOf('image/') === 0) {\n        img = item[m];\n        break;\n    }\n}\nif (img) {\n    var tmp = Dir().tempPath() + '/copyq_ocr_' + Date.now() + '.png';\n    var file = File(tmp);\n    file.openWriteOnly();\n    file.write(img);\n    file.close();\n    var res = execute('tesseract', tmp, 'stdout', '-l', 'eng');\n    File(tmp).remove();\n    var text = str(res.stdout);\n    text = text ? text.trim() : '';\n    if (text && text.length > 0) {\n        var home = Dir().homePath();\n        var notesFile = File(home + '/.config/notes/scratch.txt');\n        notesFile.openAppendOnly();\n        notesFile.write(new ByteArray('\n\n# [OCR - ' + new Date().toLocaleString() + ']\n' + text + '\n'));\n        notesFile.close();\n        add(text);\n        select(0);\n        execute('dunstify', '-a', 'osd', '-r', '9999', '📝 OCR APPENDED TO NOTES', 'Saved to scratch.txt & copied to clipboard');\n    } else {\n        execute('dunstify', '-a', 'osd', '-r', '9999', '⚠️ OCR: NO TEXT FOUND', 'Could not detect readable text.');\n    }\n} else {\n    execute('dunstify', '-a', 'osd', '-r', '9999', '⚠️ OCR ERROR', 'Selected item is not an image.');\n}\n"

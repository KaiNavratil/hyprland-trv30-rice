[Command]
Command="
    var format = \"image/png\";
    var items = getSelectedItems();
    if (items.length > 0) {
        var row = items[0];
        var img = getItem(row)[format];
        if (img) {
            var tmp = Dir().tempPath() + \"/copyq_ocr.png\";
            var file = File(tmp);
            file.openWriteOnly();
            file.write(img);
            file.close();
            
            var out = Dir().tempPath() + \"/copyq_ocr\";
            execute(\"tesseract\", tmp, out, \"-l\", \"eng\");
            
            var txtFile = File(out + \".txt\");
            txtFile.openReadOnly();
            var text = txtFile.read();
            txtFile.close();
            
            if (text && text.byteLength > 0) {
                add(text);
                remove(row);
                select(0);
                execute(\"notify-send\", \"OCR Complete\", \"Text extracted and image removed.\");
            } else {
                execute(\"notify-send\", \"OCR Failed\", \"No text found in image.\");
            }
        } else {
            execute(\"notify-send\", \"OCR Error\", \"Selected item is not an image.\");
        }
    }"
Icon=\xf022
InMenu=true
Input=image/png
Name=Extract Text (OCR)
Shortcut=ctrl+o

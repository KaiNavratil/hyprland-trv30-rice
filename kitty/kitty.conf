# ==============================================================================
# キティ端末設定 (KITTY TERMINAL CONFIGURATION)
# Theme: Tokyo 80s TRV30 — Warm Vintage Palette
#
# Palette:
#   Warm white:  #e8dfd4    Amber:       #d4944c
#   Faded blue:  #7b9db7    Warm gray:   #8a7e72
#   Warm silver: #b8a998    Warm red:    #c44444
# ==============================================================================

# ------------------------------------------------------------------------------
# フォント (FONTS)
# ------------------------------------------------------------------------------
font_family      VCR OSD Mono
bold_font        VCR OSD Mono
italic_font      VCR OSD Mono
bold_italic_font VCR OSD Mono
font_size        12.0

# 日本語フォント (Japanese Font Mapping)
# Map CJK Unicode ranges to DotGothic16 for the retro Japanese OSD feel
symbol_map U+3000-U+9FFF,U+FF00-U+FFEF DotGothic16

# ------------------------------------------------------------------------------
# カーソル (CURSOR)
# ------------------------------------------------------------------------------
# Warm amber block cursor — like a vintage recording prompt
cursor           #d4944c
cursor_shape     block
cursor_blink_interval -1
shell_integration no-cursor

# ------------------------------------------------------------------------------
# カラースキーム (COLOR SCHEME — Warm Vintage)
# ------------------------------------------------------------------------------
background #0a0808
foreground #e8dfd4
selection_background #2a2420
selection_foreground #e8dfd4

# The 16-color palette — warm, aged, vintage CRT tones
# Black
color0  #0a0808
color8  #8a7e72

# Red (warm, not neon)
color1  #c44444
color9  #d45555

# Green (muted sage — functional, not flashy)
color2  #8fbf7f
color10 #a8d8a0

# Yellow/Amber (vintage amber — the primary accent tone)
color3  #d4944c
color11 #daa86b

# Blue (faded vintage blue)
color4  #5a7ea3
color12 #7b9db7

# Magenta (dusty rose)
color5  #b06888
color13 #c88aa0

# Cyan (muted teal)
color6  #7b9db7
color14 #9bb8cc

# White (warm off-white, aged phosphor)
color7  #b8a998
color15 #e8dfd4

# ------------------------------------------------------------------------------
# ウィンドウ (WINDOW)
# ------------------------------------------------------------------------------
hide_window_decorations yes
window_margin_width 0
window_padding_width 4
background_opacity 0.92

# ------------------------------------------------------------------------------
# タブバー (TAB BAR)
# ------------------------------------------------------------------------------
tab_bar_style powerline
tab_title_template "{index}: {title}"
active_tab_foreground   #e8dfd4
active_tab_background   #1a1614
active_tab_font_style   bold
inactive_tab_foreground #8a7e72
inactive_tab_background #0a0808
inactive_tab_font_style normal

# ------------------------------------------------------------------------------
# URL & リンク (URLS)
# ------------------------------------------------------------------------------
url_color #7b9db7
url_style underline

# ------------------------------------------------------------------------------
# ベル (BELL)
# ------------------------------------------------------------------------------
enable_audio_bell no
visual_bell_duration 0.1
visual_bell_color #1a1614

# ------------------------------------------------------------------------------
# パフォーマンス (PERFORMANCE)
# ------------------------------------------------------------------------------
repaint_delay 10
input_delay 3

# ------------------------------------------------------------------------------
# スクロールバック (SCROLLBACK)
# ------------------------------------------------------------------------------
scrollback_lines 10000

# ------------------------------------------------------------------------------
# その他 (MISC)
# ------------------------------------------------------------------------------
confirm_os_window_close 0
remember_window_size no
initial_window_width 800
initial_window_height 600

general {
    lock_cmd = pidof hyprlock || bash ~/.config/hypr/scripts/lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on; (sleep 0.5 && usbreset 3151:5029 >/dev/null 2>&1 || true) &
}

# Dim screen after 5 minutes (300 seconds)
# Tier 1 timeout: Starts the idle sequence by dimming the backlight
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 30%
    on-resume = brightnessctl -r
}

# Apply heavy dimming after 5 minutes
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Lock screen after 10 minutes
# Tier 2 timeout: Locks the session, displaying the VHS paused frame (hyprlock)
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Screen off after 15 minutes  
# Tier 3 timeout: Fully turns off the monitor to save power and prevent burn-in
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

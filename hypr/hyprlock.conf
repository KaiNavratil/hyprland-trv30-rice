general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 0.0, 0.0, 1.0, 1.0
    animation = fade, 1, 5, linear
}

# ━━━ BACKGROUND ━━━
background {
    monitor =
    path = /tmp/lock_fisheye.png
    blur_size = 3
    blur_passes = 1
    brightness = 0.8
    vibrancy = 0.2
    vibrancy_darkness = 0.2
    contrast = 1.6
}

# ━━━ TIMECODE CLOCK (large, center-top area) ━━━
label {
    monitor =
    text = cmd[update:50] ~/.config/hypr/scripts/glitch_clock.sh
    color = rgba(242, 165, 51, 1.0)
    font_size = 72
    font_family = VCR OSD Mono
    position = 0, 120
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 1.0)
}

# ━━━ DATE (Japanese format) ━━━
label {
    monitor =
    text = cmd[update:60000] date '+%Y年%m月%d日 (%a)'
    color = rgba(242, 165, 51, 1.0)
    font_size = 18
    font_family = VCR OSD Mono
    position = 0, 60
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 1.0)
}

# ━━━ PAUSE INDICATOR (solid) ━━━
label {
    monitor =
    text = ❚❚ PAUSE
    color = rgba(242, 165, 51, 1.0)
    font_size = 28
    font_family = VCR OSD Mono
    position = 0, -20
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 1.0)
}

# ━━━ BLINKING REC INDICATOR (top right) ━━━
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/rec.sh
    color = rgba(242, 165, 51, 1.0)
    font_size = 24
    font_family = VCR OSD Mono
    position = -150, -150
    halign = right
    valign = top
    shadow_passes = 2
    shadow_color = rgba(0, 0, 0, 1.0)
}

# ━━━ BATTERY / TAPE REMAINING (bottom right) ━━━
label {
    monitor =
    text = cmd[update:60000] echo "TAPE SP  $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null || echo 100)%"
    color = rgba(242, 165, 51, 1.0)
    font_size = 24
    font_family = VCR OSD Mono
    position = -150, 150
    halign = right
    valign = bottom
    shadow_passes = 2
    shadow_color = rgba(0, 0, 0, 1.0)
}

# ━━━ CAMERA MODEL WATERMARK (bottom-left) ━━━
label {
    monitor =
    text = SONY DCR-TRV30  DIGITAL HANDYCAM
    color = rgba(242, 165, 51, 1.0)
    font_size = 14
    font_family = VCR OSD Mono
    position = 180, 150
    halign = left
    valign = bottom
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 1.0)
}

# ━━━ PASSWORD INPUT ━━━
input-field {
    monitor =
    size = 280, 40
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = 0
    outer_color = rgba(242, 165, 51, 1.0)
    inner_color = rgba(10, 8, 8, 0.9)
    font_color = rgba(242, 165, 51, 1.0)
    font_family = VCR OSD Mono
    fade_on_empty = false
    placeholder_text = <i>ENTER PASSWORD ▏</i>
    hide_input = false
    rounding = 0
    check_color = rgba(242, 165, 51, 1.0)
    fail_color = rgba(242, 165, 51, 1.0)
    fail_text = <i>INCORRECT PASSWORD ▏</i>
    fail_timeout = 300
    capslock_color = rgba(242, 165, 51, 1.0)
    position = 0, -100
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 1.0)
}
image {
    monitor =
    path = /tmp/scanline_fullscreen.png
    size = 1920
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 10
}

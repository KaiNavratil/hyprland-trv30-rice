<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TOKYO 80s TRV30 — DUAL-MONITOR AMBER DESKTOP RADAR</title>
  <style>
    /* ═══════════════════════════════════════════════════════════════════
     *  TOKYO 80S TRV30 MASTER DECK — VINTAGE AMBER PALETTE
     *  Matching ~/.config/hypr/command-center/style.css:
     *    Warm white:    #e8dfd4 (aged CRT phosphor text)
     *    Vintage Amber: #d4944c (vintage amber — accents, timecode, borders)
     *    Audio Amber:   #f2a533 (audio meters, highlights)
     *    Bright Amber:  #ffba3b (active focus)
     *    Pure Black:    #000000 (deep background)
     *    Chassis:       #0a0808 (panel chassis)
     *    Panel:         #11100f (sub-panels)
     *    Card:          #181614 (window cards)
     *    Border Silver: #b8a998 (primary dividers)
     *    Border Metal:  #3a352f (chassis borders)
     *    Warm Red:      #c44444 (kill / alert)
     * ═══════════════════════════════════════════════════════════════════ */

    :root {
      --bg-black: #000000;
      --bg-chassis: #0a0808;
      --bg-panel: #11100f;
      --bg-card: #181614;
      --bg-card-active: #241a10;
      --bg-subtle: #1f1c19;

      --border-metal: #3a352f;
      --border-silver: #b8a998;
      --border-dim: #22201d;

      --fg-main: #e8dfd4;
      --fg-dim: #8a7e72;
      --fg-bright: #ffffff;

      --accent-amber: #d4944c;
      --accent-audio: #f2a533;
      --accent-bright: #ffba3b;
      --accent-red: #c44444;
      --accent-blue: #7b9db7;
      --accent-green: #88aa88;

      --font-osd: 'VCR OSD Mono', 'DotGothic16', monospace;
      --shadow-osd: 2px 2px 0px #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: var(--font-osd);
      font-size: 12px;
      border-radius: 0px !important;
      text-shadow: var(--shadow-osd);
      -webkit-font-smoothing: none;
    }

    html, body {
      background-color: var(--bg-black) !important;
      color: var(--fg-main);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px 12px;
    }

    /* Subtle Amber CRT Scanlines */
    .scanlines-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      background: linear-gradient(
        rgba(15, 11, 7, 0) 50%, 
        rgba(0, 0, 0, 0.35) 50%
      ), linear-gradient(
        90deg,
        rgba(212, 148, 76, 0.02),
        rgba(0, 0, 0, 0.01),
        rgba(242, 165, 51, 0.02)
      );
      background-size: 100% 3px, 6px 100%;
      opacity: 0.85;
    }

    /* ─── HARDWARE BUTTONS & BADGES ─── */
    .badge-sony {
      background: var(--border-silver);
      color: #000000;
      font-weight: 900;
      font-size: 10px;
      letter-spacing: 1.5px;
      padding: 1px 6px;
      text-shadow: none;
      display: inline-block;
    }

    .badge-amber {
      background: var(--accent-amber);
      color: #000000;
      font-weight: bold;
      font-size: 10px;
      padding: 1px 6px;
      text-shadow: none;
      display: inline-block;
    }

    .badge-red {
      background: var(--accent-red);
      color: #ffffff;
      font-weight: bold;
      font-size: 9.5px;
      padding: 1px 5px;
      text-shadow: none;
    }

    .badge-dim {
      background: var(--bg-panel);
      border: 1px solid var(--border-metal);
      color: var(--fg-dim);
      font-size: 9.5px;
      padding: 1px 5px;
    }

    .btn-tactical {
      background: var(--bg-panel);
      border: 1px solid var(--border-metal);
      color: var(--fg-main);
      padding: 3px 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.08s, border-color 0.08s, color 0.08s;
      outline: none;
      font-size: 11px;
    }
    .btn-tactical:hover {
      background: var(--accent-amber);
      border-color: var(--accent-bright);
      color: #000000;
      text-shadow: none;
    }

    .btn-kill {
      background: #1c0e0e;
      border: 1px solid #552222;
      color: #e09999;
      padding: 2px 6px;
      cursor: pointer;
      font-size: 10px;
      transition: all 0.08s;
    }
    .btn-kill:hover {
      background: var(--accent-red);
      border-color: #ff5555;
      color: #ffffff;
      text-shadow: none;
    }

    .btn-action-sm {
      background: #141210;
      border: 1px solid var(--border-metal);
      color: var(--fg-main);
      padding: 2px 6px;
      cursor: pointer;
      font-size: 10px;
      transition: all 0.08s;
    }
    .btn-action-sm:hover {
      background: var(--accent-audio);
      border-color: var(--accent-bright);
      color: #000000;
      text-shadow: none;
    }

    @keyframes recBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .rec-indicator {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--accent-audio);
      font-weight: bold;
      font-size: 11px;
    }
    .rec-dot {
      width: 7px;
      height: 7px;
      background: var(--accent-audio);
      animation: recBlink 1.2s infinite;
      box-shadow: 0 0 6px var(--accent-audio);
    }

    /* ─── TOP MASTER BAR ─── */
    .master-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-chassis);
      border: 1px solid var(--border-silver);
      padding: 4px 10px;
      height: 34px;
      min-height: 34px;
      margin-bottom: 6px;
      gap: 12px;
    }

    .master-bar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    .master-title {
      font-size: 11.5px;
      font-weight: bold;
      color: var(--fg-main);
      letter-spacing: 0.5px;
    }

    .master-bar-center {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 700px;
    }

    /* Quick Spaces Jump Strip */
    .spaces-jump-strip {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
    }
    .space-pill {
      background: var(--bg-panel);
      border: 1px solid var(--border-metal);
      color: var(--fg-dim);
      padding: 2px 6px;
      cursor: pointer;
      font-size: 10px;
      white-space: nowrap;
      transition: all 0.08s;
    }
    .space-pill:hover {
      border-color: var(--accent-amber);
      color: var(--accent-bright);
    }
    .space-pill.is-current {
      background: var(--accent-amber);
      border-color: var(--accent-bright);
      color: #000000;
      font-weight: bold;
      text-shadow: none;
    }

    .search-input-box {
      display: flex;
      align-items: center;
      background: #000000;
      border: 1px solid var(--border-metal);
      padding: 2px 6px;
      width: 220px;
    }
    .search-input-box:focus-within {
      border-color: var(--accent-amber);
    }
    .search-input-box input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--fg-main);
      width: 100%;
      font-size: 11px;
    }
    .search-input-box input::placeholder {
      color: var(--fg-dim);
    }

    .master-bar-right {
      display: flex;
      align-items: center;
      gap: 12px;
      white-space: nowrap;
    }

    .timecode {
      font-size: 13px;
      font-weight: bold;
      color: var(--accent-amber);
      letter-spacing: 1px;
    }

    /* ─── MAIN SPACES MATRIX (ACTIVE ONLY) ─── */
    .spaces-matrix-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 4px;
      margin-bottom: 6px;
    }

    .spaces-matrix-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(460px, 1fr));
      gap: 8px;
    }

    /* Space Container */
    .space-card {
      background: var(--bg-chassis);
      border: 1px solid var(--border-metal);
      display: flex;
      flex-direction: column;
      padding: 6px 8px;
      gap: 6px;
      transition: border-color 0.12s;
    }
    .space-card.is-current-space {
      border: 1px solid var(--accent-amber);
      box-shadow: 0 0 10px rgba(212, 148, 76, 0.25);
    }

    /* Space Header */
    .space-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-dim);
      padding-bottom: 4px;
      gap: 8px;
    }

    .space-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .space-name-text {
      font-size: 12px;
      font-weight: bold;
      color: var(--accent-amber);
      letter-spacing: 0.5px;
    }

    .space-rename-form {
      display: none;
      align-items: center;
      gap: 4px;
    }
    .space-rename-input {
      background: #000000;
      border: 1px solid var(--accent-amber);
      color: var(--fg-bright);
      font-size: 11px;
      padding: 1px 4px;
      width: 100px;
      text-transform: uppercase;
      outline: none;
    }

    .space-header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Dynamic Monitor Columns Inside Each Space */
    .space-monitors-row {
      display: grid;
      grid-template-columns: repeat(var(--monitors-count, 2), minmax(0, 1fr));
      gap: 8px;
      flex: 1;
    }

    .monitor-column {
      background: var(--bg-panel);
      border: 1px solid var(--border-dim);
      display: flex;
      flex-direction: column;
      padding: 6px;
      gap: 6px;
      min-height: 160px;
    }

    .monitor-column-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-dim);
      padding-bottom: 3px;
      font-size: 10.5px;
      color: var(--fg-dim);
    }

    .monitor-tag {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: bold;
      color: var(--fg-main);
    }
    .monitor-pip {
      width: 5px;
      height: 5px;
      background: var(--accent-amber);
    }

    .window-cards-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .empty-space-banner {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px dashed var(--border-dim);
      color: var(--border-metal);
      font-size: 10px;
      letter-spacing: 1px;
      min-height: 90px;
    }

    /* ─── TACTICAL WINDOW SETTINGS CARD ─── */
    .window-card {
      background: var(--bg-card);
      border: 1px solid var(--border-metal);
      display: flex;
      flex-direction: column;
      padding: 5px 6px;
      gap: 4px;
      transition: all 0.08s;
      position: relative;
    }
    .window-card:hover {
      border-color: var(--accent-amber);
      background: #1c1815;
    }
    .window-card.is-window-active {
      border-color: var(--accent-bright);
      background: var(--bg-card-active);
      box-shadow: 0 0 8px rgba(242, 165, 51, 0.3);
    }

    .window-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10.5px;
      border-bottom: 1px solid #221e1a;
      padding-bottom: 3px;
    }

    .window-class-tag {
      font-weight: bold;
      color: var(--accent-amber);
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .window-flags {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 9.5px;
    }

    /* Window Visual Viewport (Live thumb or tactile mockup) */
    .window-viewport {
      width: 100%;
      height: 85px;
      background: #050404;
      border: 1px solid #221e1a;
      overflow: hidden;
      position: relative;
      cursor: pointer;
    }
    .window-viewport img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: contrast(1.05) brightness(0.95);
    }
    .window-viewport-amber-tint {
      position: absolute;
      inset: 0;
      background: rgba(212, 148, 76, 0.05);
      pointer-events: none;
    }

    .window-title-text {
      font-size: 10.5px;
      color: var(--fg-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }
    .window-title-text:hover {
      color: var(--accent-bright);
    }

    /* ─── PER-WINDOW USAGE METRICS (CLEAN BENTO DESIGN) ─── */
    .viewport-hud-strip {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(10, 8, 7, 0.88);
      border-top: 1px solid rgba(212, 148, 76, 0.4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 6px;
      font-size: 8.5px;
      z-index: 10;
      backdrop-filter: blur(2px);
    }

    .hud-item {
      color: var(--fg-main);
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .hud-item.hud-warn {
      color: var(--accent-red);
      font-weight: 900;
    }

    .hud-dim {
      color: var(--fg-dim);
      font-size: 8px;
    }

    .window-metrics-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0d0b09;
      border: 1px solid #261f18;
      padding: 3px 6px;
      box-sizing: border-box;
    }

    .win-metric-pill {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }

    .m-icon {
      font-size: 8.5px;
      line-height: 1;
    }

    .m-lbl {
      color: var(--fg-dim);
      font-size: 8px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .m-val {
      color: var(--fg-bright);
      font-size: 8.5px;
      font-weight: bold;
      white-space: nowrap;
    }

    .m-val.val-high {
      color: var(--accent-red);
      font-weight: 900;
    }

    .m-mini-track {
      flex: 1;
      height: 3px;
      background: #1c1611;
      border: 1px solid #36291e;
      overflow: hidden;
      min-width: 18px;
    }

    .m-mini-fill {
      height: 100%;
      transition: width 0.3s ease;
    }

    .fill-cpu {
      background: var(--accent-amber);
    }

    .fill-mem {
      background: var(--accent-blue);
    }

    .badge-shared {
      background: #1a1510;
      border: 1px solid #3a2e22;
      color: var(--accent-amber);
      font-size: 7.5px;
      font-weight: bold;
      padding: 0 4px;
      letter-spacing: 0.5px;
    }

    .scratchpad-metric-tag {
      font-size: 8px;
      color: var(--accent-amber);
      font-weight: bold;
      margin-left: 4px;
    }

    /* Tactical Window Settings Toolbar */
    .window-settings-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #221e1a;
      padding-top: 3px;
      gap: 4px;
    }

    .window-settings-left {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .window-settings-right {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    /* Space Move Dropdown */
    .space-move-select {
      background: #141210;
      border: 1px solid var(--border-metal);
      color: var(--accent-amber);
      font-size: 9.5px;
      padding: 1px 3px;
      outline: none;
      cursor: pointer;
    }
    .space-move-select:hover {
      border-color: var(--accent-amber);
    }

    /* ─── BOTTOM SCRATCHPAD FLEET DECK ─── */
    .bottom-deck {
      background: var(--bg-chassis);
      border: 1px solid var(--border-metal);
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .bottom-deck-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-dim);
      padding-bottom: 3px;
      font-size: 10.5px;
    }

    .scratchpads-fleet-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 6px;
    }

    .scratchpad-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-metal);
      padding: 4px 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      cursor: pointer;
      transition: all 0.08s;
    }
    .scratchpad-card:hover {
      border-color: var(--accent-amber);
      background: #191613;
    }
    .scratchpad-card.is-active-sp {
      border-color: var(--accent-bright);
      background: #241c14;
      box-shadow: 0 0 6px rgba(242, 165, 51, 0.35);
    }

    .scratchpad-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      font-weight: bold;
      color: var(--accent-amber);
    }

    .scratchpad-title-preview {
      font-size: 9.5px;
      color: var(--fg-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .scratchpad-status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9px;
      color: var(--fg-dim);
      border-top: 1px solid #1a1715;
      padding-top: 2px;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #0a0808;
    }
    ::-webkit-scrollbar-thumb {
      background: #3a352f;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-amber);
    }
  </style>
</head>
<body>

  <!-- Subtle CRT Amber Scanlines -->
  <div class="scanlines-overlay"></div>

  <!-- ─── TOP MASTER BAR ─── -->
  <header class="master-bar">
    <div class="master-bar-left">
      <span class="badge-sony">SONY</span>
      <span class="master-title" id="radar-main-title">TRV30 SPATIAL RADAR</span>
      <span style="color: var(--accent-amber); font-size: 11px;" id="radar-sub-title">// 多画面タクティカルコンソール</span>
      <div class="rec-indicator">
        <span class="rec-dot"></span>
        <span>RADAR ACTIVE</span>
      </div>
    </div>

    <!-- Center Jump Strip & Search Filter -->
    <div class="master-bar-center">
      <div id="spaces-jump-strip" class="spaces-jump-strip">
        <!-- Injected via JS -->
      </div>
      <div class="search-input-box">
        <span style="color: var(--accent-amber); font-size: 10px; margin-right: 4px;">FIND:</span>
        <input 
          id="search-input" 
          type="text" 
          placeholder="Class or title..." 
          oninput="onSearchInput(this.value)"
        />
      </div>
    </div>

    <!-- Right Telemetry & Actions -->
    <div class="master-bar-right">
      <div style="font-size: 11px;">
        <span style="color: var(--fg-dim);">DISPLAYS:</span>
        <span id="stat-displays-count" style="color: var(--accent-amber); font-weight: bold;">--</span>
      </div>
      <div style="font-size: 11px;">
        <span style="color: var(--fg-dim);">ACTIVE SPACES:</span>
        <span id="stat-active-spaces" style="color: var(--accent-bright); font-weight: bold;">--</span>
      </div>
      <div style="font-size: 11px;">
        <span style="color: var(--fg-dim);">WINDOWS:</span>
        <span id="stat-total-wins" style="color: var(--accent-audio); font-weight: bold;">--</span>
      </div>
      <div class="timecode" id="hud-timecode">00:00:00:00</div>
      <button class="btn-kill" onclick="closeRadar()">✕ CLOSE [ESC]</button>
    </div>
  </header>

  <!-- ─── MAIN MATRIX: ONLY ACTIVE SPACES ─── -->
  <main class="spaces-matrix-container">
    <div id="spaces-grid" class="spaces-matrix-grid">
      <!-- Active spaces injected here -->
    </div>
  </main>

  <!-- ─── BOTTOM SCRATCHPAD FLEET DECK ─── -->
  <footer class="bottom-deck">
    <div class="bottom-deck-header">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="color: var(--accent-amber); font-weight: bold;">⚡ RESIDENT SCRATCHPAD FLEET</span>
        <span style="color: var(--fg-dim);">Click to summon / stow on current display</span>
      </div>
      <div style="color: var(--fg-dim); font-size: 9.5px; display: flex; gap: 12px;">
        <span>CHORDS: <b style="color: var(--accent-amber);">Super + Z / X / C / D / V / Esc</b></span>
        <span>PANORAMIC: <b style="color: var(--accent-amber);">Super + Shift + Z / X / V / Esc</b></span>
        <span>ANCHOR: <b style="color: var(--accent-bright);">Super + Y</b></span>
      </div>
    </div>
    <div id="scratchpads-deck" class="scratchpads-fleet-grid">
      <!-- Injected via JS -->
    </div>
  </footer>

  <!-- ─── SCRIPT LOGIC & AUDIO SYNTHESIZER ─── -->
  <script>
    let audioCtx = null;
    function playBeep(freq = 700, duration = 0.02, vol = 0.04) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    // ─── MAIN RENDERER (ONLY SHOWS ACTIVE SPACES) ───
    window.renderRadar = function(state) {
      currentState = state;

      // Update Top Status Stats
      const monCount = state.monitor_count || 1;
      const monStatEl = document.getElementById('stat-displays-count');
      if (monStatEl) monStatEl.textContent = monCount;

      const mainTitleEl = document.getElementById('radar-main-title');
      const subTitleEl = document.getElementById('radar-sub-title');
      if (mainTitleEl) {
        mainTitleEl.textContent = monCount === 1 
          ? 'TRV30 SINGLE-DISPLAY RADAR' 
          : (monCount === 2 ? 'TRV30 DUAL-MONITOR RADAR' : `TRV30 MULTI-DISPLAY RADAR [${monCount}X]`);
      }
      if (subTitleEl) {
        subTitleEl.textContent = monCount === 1 
          ? '// 単画面タクティカルコンソール' 
          : (monCount === 2 ? '// 双頭空間タクティカルコンソール' : `// ${monCount}画面同期マトリクスコンソール`);
      }

      const activeSpacesCount = Object.keys(state.spaces || {}).length;
      document.getElementById('stat-active-spaces').textContent = activeSpacesCount;
      document.getElementById('stat-total-wins').textContent = state.total_windows || 0;

      // Render Jump Strip
      const jumpStrip = document.getElementById('spaces-jump-strip');
      jumpStrip.innerHTML = '';
      
      // Render quick jump for all active spaces
      Object.keys(state.spaces || {}).sort((a,b) => Number(a)-Number(b)).forEach(s => {
        const sp = state.spaces[s];
        const isCurrent = sp.is_current;
        const totalWins = sp.columns ? sp.columns.reduce((acc, col) => acc + (col.windows ? col.windows.length : 0), 0) : ((sp.main ? sp.main.length : 0) + (sp.comp ? sp.comp.length : 0));
        
        const pill = document.createElement('div');
        pill.className = `space-pill ${isCurrent ? 'is-current' : ''}`;
        pill.innerHTML = `<span>${s}: ${sp.name}</span> <span style="font-size: 8.5px; opacity: 0.8;">(${totalWins})</span>`;
        pill.onclick = () => switchSpace(Number(s));
        jumpStrip.appendChild(pill);
      });

      // Render Main Grid (ONLY ACTIVE SPACES)
      const grid = document.getElementById('spaces-grid');
      grid.innerHTML = '';

      const activeSpaceIds = Object.keys(state.spaces || {}).sort((a, b) => Number(a) - Number(b));

      if (activeSpaceIds.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--fg-dim);">NO ACTIVE WORKSPACES WITH OPEN WINDOWS</div>`;
        return;
      }

      activeSpaceIds.forEach(s => {
        const spData = state.spaces[s];
        const isCurrent = spData.is_current;

        // Dynamic columns from server, fallback to legacy main/comp if columns not provided
        const columns = spData.columns || [
          { monitor_name: 'DISPLAY 1', monitor_index: 0, workspace_id: Number(s), is_primary: true, windows: spData.main || [] }
        ];

        // Apply search query filter
        const filterFn = (w) => {
          if (!searchQuery) return true;
          return (w.title || '').toLowerCase().includes(searchQuery) || (w.class || '').toLowerCase().includes(searchQuery);
        };

        const totalFilteredWins = columns.reduce((acc, col) => acc + (col.windows || []).filter(filterFn).length, 0);
        if (searchQuery && totalFilteredWins === 0) return;

        // Space Card
        const spaceCard = document.createElement('div');
        spaceCard.className = `space-card ${isCurrent ? 'is-current-space' : ''}`;

        // Header
        const header = document.createElement('div');
        header.className = 'space-header';
        header.innerHTML = `
          <div class="space-header-left">
            <span class="${isCurrent ? 'badge-amber' : 'badge-dim'}">SPACE ${s}</span>
            <span id="space-title-${s}" class="space-name-text">${spData.name}</span>
            <span style="color: var(--fg-dim); font-size: 10px;">${spData.jp}</span>

            <!-- Inline Rename Form -->
            <div id="space-rename-form-${s}" class="space-rename-form">
              <input type="text" value="${spData.name}" class="space-rename-input" onkeydown="if(event.key==='Enter') submitRenameSpace(${s}); else if(event.key==='Escape') cancelRenameSpace(${s});" />
              <button class="btn-action-sm" onclick="submitRenameSpace(${s})">OK</button>
              <button class="btn-kill" onclick="cancelRenameSpace(${s})">✕</button>
            </div>

            <button id="btn-rename-${s}" class="btn-action-sm" onclick="startRenameSpace(${s})" title="Rename this workspace">✎ RENAME</button>
          </div>

          <div class="space-header-right">
            ${isCurrent ? '<span class="badge-amber" style="box-shadow: 0 0 6px var(--accent-amber);">● ACTIVE SPACE</span>' : ''}
            <button class="btn-tactical" onclick="switchSpace(${s})" title="Switch displays to Space ${s}">
              ➔ JUMP [${s}]
            </button>
          </div>
        `;
        spaceCard.appendChild(header);

        // Dynamic Monitors Container
        const monitorsRow = document.createElement('div');
        monitorsRow.className = 'space-monitors-row';
        const monCount = columns.length;
        monitorsRow.style.setProperty('--monitors-count', monCount);

        const pipColors = ['var(--accent-amber)', 'var(--accent-audio)', 'var(--accent-bright)', '#00e5ff', '#ff5555'];

        columns.forEach((col, idx) => {
          const colEl = document.createElement('div');
          colEl.className = 'monitor-column';
          const pipColor = pipColors[idx % pipColors.length];
          const tagLabel = monCount === 1 
            ? `${col.monitor_name} [MAIN]` 
            : `${col.monitor_name} [DISP ${idx + 1}]`;

          colEl.innerHTML = `
            <div class="monitor-column-header">
              <div class="monitor-tag">
                <span class="monitor-pip" style="background: ${pipColor};"></span>
                <span>${tagLabel}</span>
              </div>
              <span style="font-size: 9.5px; opacity: 0.85;">WS ${col.workspace_id}</span>
            </div>
          `;

          const winList = document.createElement('div');
          winList.className = 'window-cards-list';

          const filteredWins = (col.windows || []).filter(filterFn);

          if (filteredWins.length === 0) {
            winList.innerHTML = `<div class="empty-space-banner">[NO WINDOWS ON ${col.monitor_name}]</div>`;
          } else {
            filteredWins.forEach(w => {
              winList.appendChild(createWindowCard(w, s, col.workspace_id, monCount, idx));
            });
          }

          colEl.appendChild(winList);
          monitorsRow.appendChild(colEl);
        });

        spaceCard.appendChild(monitorsRow);
        grid.appendChild(spaceCard);
      });

      // Render Scratchpad Bottom Deck
      const spDeck = document.getElementById('scratchpads-deck');
      spDeck.innerHTML = '';

      Object.entries(SCRATCHPAD_METAS).forEach(([spName, meta]) => {
        const wins = (state.scratchpads && state.scratchpads[spName]) || [];
        const isAnchored = (state.anchors && state.anchors[spName]);
        const onMonitor = (state.active_specials && state.active_specials[spName]);
        const hasWindows = wins.length > 0;

        const card = document.createElement('div');
        card.className = `scratchpad-card ${onMonitor ? 'is-active-sp' : ''}`;
        card.onclick = () => toggleScratchpad(spName);

        const firstTitle = hasWindows ? wins[0].title : 'Stowed / Available';
        const spCpu = (hasWindows && wins[0].cpu !== undefined) ? wins[0].cpu : null;
        const spMem = (hasWindows && wins[0].rss_mb !== undefined) ? (wins[0].rss_mb >= 1024 ? `${(wins[0].rss_mb/1024).toFixed(1)}G` : `${Math.round(wins[0].rss_mb)}M`) : null;

        card.innerHTML = `
          <div class="scratchpad-card-top">
            <span>${meta.icon} ${meta.label}</span>
            ${isAnchored ? '<span style="color: var(--accent-bright); font-size: 8.5px;">📌 PIN</span>' : ''}
          </div>
          <div class="scratchpad-title-preview" title="${firstTitle}">
            ${firstTitle}
          </div>
          <div class="scratchpad-status-row">
            <span style="color: ${onMonitor ? 'var(--accent-bright)' : 'var(--fg-dim)'}; font-weight: ${onMonitor ? 'bold' : 'normal'};">
              ${onMonitor ? `ON: ${onMonitor}` : 'STOWED'}
            </span>
            ${spCpu !== null ? `<span class="scratchpad-metric-tag">⚡${spCpu}% 💾${spMem}</span>` : ''}
            <span style="color: var(--accent-amber);">${meta.chord}</span>
          </div>
        `;
        spDeck.appendChild(card);
      });
    };

    // Helper: Create Tactical Window Card with Full Settings Actions & Clean Metrics
    function createWindowCard(w, spaceId, currentWs, monitorCount = 2, currentMonIdx = 0) {
      const card = document.createElement('div');
      card.className = `window-card ${w.active ? 'is-window-active' : ''}`;

      function formatMem(mb) {
        if (!mb || mb <= 0) return '0M';
        if (mb >= 1024) return `${(mb / 1024).toFixed(1)}G`;
        return `${Math.round(mb)}M`;
      }

      const memStr = formatMem(w.rss_mb);
      const cpuVal = (w.cpu !== undefined) ? w.cpu : 0.0;
      const isHighCpu = cpuVal >= 15.0;

      // Viewport Content (Thumbnail or Mockup)
      let viewportInner = '';
      if (w.thumb) {
        viewportInner = `
          <img src="${w.thumb}?t=${Date.now()}" alt="preview" />
          <div class="window-viewport-amber-tint"></div>
        `;
      } else {
        viewportInner = generateTactileMockup(w.class, w.title);
      }

      let swapButtonHtml = '';
      if (monitorCount <= 1) {
        swapButtonHtml = `
          <button class="btn-action-sm" style="opacity: 0.45; cursor: default;" title="Single display mode — attach another display to move windows across monitors">
            1 MONITOR
          </button>
        `;
      } else if (monitorCount === 2) {
        const otherIdx = currentMonIdx === 0 ? 1 : 0;
        const targetLabel = otherIdx === 0 ? '⇄ MAIN' : '⇄ DISP 2';
        swapButtonHtml = `
          <button class="btn-action-sm" onclick="swapWindowMonitor('${w.address}', ${currentWs})" title="Move window to other monitor">
            ${targetLabel}
          </button>
        `;
      } else {
        const nextMon = ((currentMonIdx + 1) % monitorCount) + 1;
        swapButtonHtml = `
          <button class="btn-action-sm" onclick="swapWindowMonitor('${w.address}', ${currentWs})" title="Cycle window to next monitor">
            ⇄ DISP ${nextMon}
          </button>
        `;
      }

      card.innerHTML = `
        <div class="window-card-header">
          <div class="window-class-tag" title="${w.class}">[${w.class}]</div>
          <div class="window-flags">
            ${w.active ? '<span class="badge-amber">● ACTIVE</span>' : ''}
            <span class="badge-dim">${w.floating ? 'FLOAT' : 'TILED'}</span>
            ${w.pinned ? '<span class="badge-amber">📌 PIN</span>' : ''}
          </div>
        </div>

        <div class="window-viewport" onclick="focusWindow(${spaceId}, '${w.address}')" title="Click to Jump & Focus">
          ${viewportInner}
          <!-- Tactical CRT OSD Telemetry Bar (Overlay in Viewport Bottom) -->
          <div class="viewport-hud-strip">
            <span class="hud-item ${isHighCpu ? 'hud-warn' : ''}">⚡ ${cpuVal}%</span>
            <span class="hud-item">💾 ${memStr}</span>
            <span class="hud-item hud-dim">PID ${w.pid || '--'}</span>
          </div>
        </div>

        <!-- Clean Per-Window Usage Metrics Bar -->
        <div class="window-metrics-bar">
          <div class="win-metric-pill" title="Process CPU Utilization: ${cpuVal}%">
            <span class="m-icon">⚡</span>
            <span class="m-lbl">CPU</span>
            <span class="m-val ${isHighCpu ? 'val-high' : ''}">${cpuVal}%</span>
            <div class="m-mini-track">
              <div class="m-mini-fill fill-cpu" style="width: ${Math.min(100, cpuVal * 2.5)}%"></div>
            </div>
          </div>
          <div class="win-metric-pill" title="Resident Set Memory Footprint: ${memStr}">
            <span class="m-icon">💾</span>
            <span class="m-lbl">RAM</span>
            <span class="m-val">${memStr}</span>
            <div class="m-mini-track">
              <div class="m-mini-fill fill-mem" style="width: ${Math.min(100, (w.rss_mb / 4096) * 100)}%"></div>
            </div>
          </div>
          ${w.is_shared ? '<span class="badge-shared" title="Multi-window shared process pool">SHARED</span>' : ''}
        </div>

        <div class="window-title-text" onclick="focusWindow(${spaceId}, '${w.address}')" title="${w.title}">
          ${w.title}
        </div>

        <!-- Tactical Window Control Settings Toolbar -->
        <div class="window-settings-toolbar">
          <div class="window-settings-left">
            <button class="btn-action-sm" onclick="focusWindow(${spaceId}, '${w.address}')" title="Jump to Space ${spaceId} and focus this window">
              ➔ JUMP
            </button>
            <button class="btn-action-sm" onclick="toggleFloating('${w.address}')" title="Toggle Float / Tile mode">
              ${w.floating ? '⇲ TILE' : '⇱ FLOAT'}
            </button>
            <button class="btn-action-sm" onclick="togglePin('${w.address}')" title="Pin window across workspaces">
              ${w.pinned ? 'UNPIN' : '📌 PIN'}
            </button>
            ${swapButtonHtml}
          </div>

          <div class="window-settings-right">
            <!-- Move To Space Selector -->
            <select class="space-move-select" onchange="if(this.value) { moveWindowToSpace('${w.address}', ${currentWs}, this.value); this.value=''; }" title="Move window to another space">
              <option value="">⇄ MOVE...</option>
              <option value="1">SPACE 1</option>
              <option value="2">SPACE 2</option>
              <option value="3">SPACE 3</option>
              <option value="4">SPACE 4</option>
              <option value="5">SPACE 5</option>
              <option value="6">SPACE 6</option>
              <option value="7">SPACE 7</option>
              <option value="8">SPACE 8</option>
              <option value="9">SPACE 9</option>
            </select>

            <button class="btn-kill" onclick="closeWindow('${w.address}')" title="Close window">
              ✕ KILL
            </button>
          </div>
        </div>
      `;

      return card;
    }

    window.onload = () => {
      const input = document.getElementById('search-input');
      if (input) input.focus();
    };
  </script>
</body>
</html>

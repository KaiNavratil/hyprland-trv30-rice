--  TOKYO 80s TRV30 — DYNAMIC MONITOR CONFIGURATION
--  東京 80s TRV30 // ディスプレイ構成設定
# ═══════════════════════════════════════════════════════════════════════════════

# External Big Monitor / Projector on HDMI (Left): native crisp 1:1 scale at 0x0
monitor = HDMI-A-1, preferred, 0x0, 1.00

# External Big Monitor / Projector on DisplayPort / USB-C
monitor = DP-1, preferred, 0x0, 1.00
monitor = DP-2, preferred, 0x0, 1.00
monitor = DP-3, preferred, 0x0, 1.00
monitor = DP-4, preferred, 0x0, 1.00

# Laptop Screen (Right): positioned at 1920x0, scaled at 1.30
monitor = eDP-1, preferred, 1920x0, 1.30

# Fallback for any other display or standalone laptop
monitor = , preferred, auto, 1.00

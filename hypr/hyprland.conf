# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃ TOKYO 80s TRV30 CAMCORDER RICE - HYPRLAND CONFIG            ┃
# ┃ ソニー TRV30 ハンディカム (DIGITAL VIDEO CASSETTE)          ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# ┌─────────────────────────────────────────────────────────────┐
# │ 1. MONITORS (モニター)                                      │
# Dynamic Monitor Configuration (Tokyo Dual-Monitor Topology)
source = ~/.config/hypr/monitors.conf

# ┌─────────────────────────────────────────────────────────────┐
# │ 2. AUTOSTART (自動起動)                                     │
# └─────────────────────────────────────────────────────────────┘
# System tray & core utilities
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = waybar -c ~/.config/waybar/config-top -s ~/.config/waybar/style.css &
# exec-once = waybar -c ~/.config/waybar/config-scanlines -s ~/.config/waybar/style-scanlines.css &
exec-once = nm-applet --indicator &
exec-once = blueman-applet &

# Try hyprpolkitagent first
exec-once = /usr/lib/hyprpolkitagent &
exec-once = dunst &
exec-once = hypridle &
exec-once = bash ~/.config/hypr/scripts/toggle-vcr.sh &

# Core Daemons
exec-once = python3 ~/.config/hypr/scripts/audio-guard.py &
exec-once = env WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 python3 ~/.config/hypr/desktop-radar/app.py &

# Auto-launch apps (window rules will place them in correct workspaces)
exec-once = vivaldi-stable
exec-once = kitty
exec-once = vivaldi-stable --app=https://calendar.notion.so
exec-once = spotify-launcher --skip-update
exec-once = vesktop

# ┌─────────────────────────────────────────────────────────────┐
# │ 3. ENVIRONMENT VARIABLES (環境変数)                         │
# └─────────────────────────────────────────────────────────────┘
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct
env = HYPRCURSOR_THEME,hyprcursor
env = PATH,/home/kaijnav/.local/bin:$PATH
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# ┌─────────────────────────────────────────────────────────────┐
# │ 4. GENERAL (一般設定)                                       │
# └─────────────────────────────────────────────────────────────┘
autogenerated = 0

general {
    gaps_in = 2
    gaps_out = 0
    border_size = 2
    col.active_border = rgba(b8a998ff)
    col.inactive_border = rgba(0a0808ff)
    layout = dwindle
}

dwindle {
    preserve_split = true
    force_split = 0
}

# ┌─────────────────────────────────────────────────────────────┐
# │ 5. DECORATION & SHADOW (装飾)                               │
# └─────────────────────────────────────────────────────────────┘
decoration {
    rounding = 0
    blur {
        enabled = false
    }
}


# ┌─────────────────────────────────────────────────────────────┐
# │ 6. ANIMATIONS (アニメーション - メカニカル)                 │
# └─────────────────────────────────────────────────────────────┘
animations {
    enabled = yes
    bezier = snap, 0.0, 0.85, 0.0, 1.0
    animation = windows, 1, 1, snap, slide
    animation = windowsIn, 1, 1, snap, slide
    animation = windowsOut, 1, 1, snap, slide
    animation = windowsMove, 1, 1, snap, slide
    animation = fade, 1, 1, snap
    animation = workspaces, 1, 1, snap, slide
    animation = specialWorkspace, 1, 2, snap, fade
}

# ┌─────────────────────────────────────────────────────────────┐
# │ 7. INPUT (入力デバイス)                                     │
# └─────────────────────────────────────────────────────────────┘
input {
    kb_layout = custom_arrows
    follow_mouse = 1
    sensitivity = 0
    # Disable earbud in-ear detection / AVRCP keyboard events

    touchpad {
        natural_scroll = true
        tap-to-click = true
        tap-and-drag = true
        drag_lock = false
    }
}

cursor {
    no_hardware_cursors = true
    inactive_timeout = 0
    hide_on_key_press = false
    no_warps = true
    warp_on_change_workspace = 0
}


# ┌─────────────────────────────────────────────────────────────┐
# │ 8. MASTER LAYOUT & WORKSPACES                               │
# └─────────────────────────────────────────────────────────────┘

# Dynamic Workspace Topology across Dual & Single Displays
source = ~/.config/hypr/workspaces.conf

# Scratchpad - General (Custom Magic Scratchpad - Super + Esc)
workspace = special:magic, gapsout:0, gapsin:0, border:false

# Scratchpad - Music
workspace = special:music, gapsout:60

# Scratchpad - Discord
workspace = special:discord, gapsout:60

# Scratchpad - Notes & Clipboard
workspace = special:notes, gapsout:60, gapsin:4

# Scratchpad - Calendar
workspace = special:calendar, gapsout:60

# Scratchpad - Command Center (Retro Master Deck)
workspace = special:center, gapsout:0, gapsin:0, border:false

# Scratchpad - Radar (Tokyo Dual-Monitor Console)
workspace = special:radar, gapsout:0, gapsin:0, border:false

# Special lockscreen blink animation to hide shader compilation
windowrule = fullscreen 1, match:class = ^(crt-blink)$
windowrule = float 1, match:class = ^(crt-blink)$

# Prevent apps from self-maximizing on launch and breaking tiling
# ┌─────────────────────────────────────────────────────────────┐
# │ 10. KEYBINDINGS (キーバインド)                              │
$mod = SUPER

# Applications
bind = $mod, Return, exec, kitty
bind = $mod, Space, exec, pkill rofi || rofi -show drun
bind = $mod, E, exec, nautilus
bind = $mod, R, exec, /home/kaijnav/.local/bin/roblox-studio
bind = $mod, A, exec, ~/.config/hypr/scripts/launch-ag.sh
bind = $mod SHIFT, left, exec, ~/.config/hypr/scripts/swap-workspace.sh left
bind = $mod SHIFT, right, exec, ~/.config/hypr/scripts/swap-workspace.sh right
bind = $mod, Q, exec, ~/.config/hypr/scripts/kill-and-remember.sh
bind = $mod SHIFT, Q, exec, hyprctl dispatch killwindow
# Neutralize Ctrl+Q (prevent accidental app exits in browsers/terminals)
bind = CTRL, Q, exec, true
# Reopen closed windows (Super+T and Super+Shift+T)
bind = $mod, T, exec, ~/.config/hypr/scripts/reopen-last.sh
bind = $mod SHIFT, T, exec, ~/.config/hypr/scripts/reopen-last.sh
bind = $mod CTRL, T, togglefloating
bind = $mod, M, exec, bash ~/.config/hypr/scripts/lock.sh

bind = $mod, B, exec, ~/.config/hypr/scripts/power-mode.sh
bind = $mod SHIFT, B, exec, bash ~/.config/waybar/scripts/restart-waybar.sh
bind = $mod SHIFT, C, exec, bash ~/.config/hypr/scripts/toggle-vcr.sh
bind = $mod, O, exec, bash ~/.config/hypr/scripts/toggle-insomnia.sh
# Display & Power Deck (Super + G)
bind = $mod, G, exec, ~/.config/hypr/scripts/toggle-scratchpad.sh display

# Window Management
bind = $mod, left, swapwindow, l
bind = $mod, right, swapwindow, r
bind = $mod, up, swapwindow, u
bind = $mod, down, swapwindow, d
bind = ALT, Tab, exec, ~/.config/hypr/scripts/toggle-radar.sh
bind = $mod, Tab, focuscurrentorlast
bind = $mod, W, exec, ~/.config/hypr/scripts/toggle-radar.sh
bind = $mod, H, exec, ~/.config/hypr/scripts/toggle-bt-mic.sh
bind = $mod ALT, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

bind = $mod, F, fullscreen, 0

# Multi-Monitor Management
bind = $mod SHIFT, D, exec, ~/.config/hypr/scripts/display-menu.sh
bind = $mod, comma, focusmonitor, -1
bind = $mod, period, focusmonitor, +1
bind = $mod, bracketleft, focusmonitor, -1
bind = $mod, bracketright, focusmonitor, +1
bind = $mod SHIFT, comma, movewindow, mon:-1
bind = $mod SHIFT, period, movewindow, mon:+1
bind = $mod SHIFT, bracketleft, movewindow, mon:-1
bind = $mod SHIFT, bracketright, movewindow, mon:+1

# Master Layout
bind = $mod SHIFT, H, layoutmsg, swapwithmaster master
bind = $mod SHIFT, L, layoutmsg, rollnext

# Workspaces
bind = $mod, 1, exec, ~/.config/hypr/scripts/switch-ws.sh 1
bind = $mod, 2, exec, ~/.config/hypr/scripts/switch-ws.sh 2
bind = $mod, 3, exec, ~/.config/hypr/scripts/switch-ws.sh 3
bind = $mod, 4, exec, ~/.config/hypr/scripts/switch-ws.sh 4
bind = $mod, 5, exec, ~/.config/hypr/scripts/switch-ws.sh 5
bind = $mod, 6, exec, ~/.config/hypr/scripts/switch-ws.sh 6
bind = $mod, 7, exec, ~/.config/hypr/scripts/switch-ws.sh 7
bind = $mod, 8, exec, ~/.config/hypr/scripts/switch-ws.sh 8
bind = $mod, 9, exec, ~/.config/hypr/scripts/switch-ws.sh 9

bind = $mod SHIFT, 1, exec, ~/.config/hypr/scripts/move-to-space.sh 1
bind = $mod SHIFT, 2, exec, ~/.config/hypr/scripts/move-to-space.sh 2
bind = $mod SHIFT, 3, exec, ~/.config/hypr/scripts/move-to-space.sh 3
bind = $mod SHIFT, 4, exec, ~/.config/hypr/scripts/move-to-space.sh 4
bind = $mod SHIFT, 5, exec, ~/.config/hypr/scripts/move-to-space.sh 5
bind = $mod SHIFT, 6, exec, ~/.config/hypr/scripts/move-to-space.sh 6
bind = $mod SHIFT, 7, exec, ~/.config/hypr/scripts/move-to-space.sh 7
bind = $mod SHIFT, 8, exec, ~/.config/hypr/scripts/move-to-space.sh 8
bind = $mod SHIFT, 9, exec, ~/.config/hypr/scripts/move-to-space.sh 9

# Scratchpad Toggles & Multi-Deck Controls
# Custom Scratchpad (Super + Esc)
bind = $mod, Escape, exec, ~/.config/hypr/scripts/toggle-scratchpad.sh magic
bind = $mod SHIFT, Escape, movetoworkspace, special:magic
bind = $mod, grave, exec, ~/.config/hypr/scripts/toggle-scratchpad.sh magic
bind = $mod SHIFT, grave, movetoworkspace, special:magic

# Single-Monitor Scratchpads
bind = $mod, Z, exec, ~/.config/hypr/scripts/toggle-scratchpad.sh music
bind = $mod, X, exec, ~/.config/hypr/scripts/toggle-scratchpad.sh discord
bind = $mod, C, exec, ~/.config/hypr/scripts/toggle-scratchpad.sh calendar
bind = $mod, D, exec, ~/.config/hypr/scripts/toggle-scratchpad.sh dev
bind = $mod, V, exec, ~/.config/hypr/scripts/launch-notes.sh

# Bloat Escape (TRV30 Master Deck Command Center: Super + Plus / Equal)
bind = $mod, equal, exec, ~/.config/hypr/scripts/toggle-scratchpad.sh center
bind = $mod, plus, exec, ~/.config/hypr/scripts/toggle-scratchpad.sh center
bind = $mod SHIFT, equal, exec, ~/.config/hypr/scripts/toggle-scratchpad.sh center
bind = $mod SHIFT, plus, exec, ~/.config/hypr/scripts/toggle-scratchpad.sh center
bind = $mod, KP_Add, exec, ~/.config/hypr/scripts/toggle-scratchpad.sh center

# Panoramic (Multi-Monitor Coordinated) Scratchpads
bind = $mod SHIFT, Z, exec, ~/.config/hypr/scripts/panoramic-scratchpad.sh music
bind = $mod SHIFT, X, exec, ~/.config/hypr/scripts/panoramic-scratchpad.sh comms
bind = $mod SHIFT, V, exec, ~/.config/hypr/scripts/panoramic-scratchpad.sh research
bind = $mod CTRL, equal, exec, ~/.config/hypr/scripts/panoramic-scratchpad.sh cockpit

# Scratchpad Stacking & Concurrent Mode
bind = $mod CTRL, Z, exec, ~/.config/hypr/scripts/toggle-scratchpad.sh music --stack
bind = $mod CTRL, X, exec, ~/.config/hypr/scripts/toggle-scratchpad.sh discord --stack
bind = $mod CTRL, C, exec, ~/.config/hypr/scripts/toggle-scratchpad.sh calendar --stack
bind = $mod CTRL, D, exec, ~/.config/hypr/scripts/toggle-scratchpad.sh dev --stack
bind = $mod CTRL, V, exec, ~/.config/hypr/scripts/toggle-scratchpad.sh notes --stack
bind = $mod CTRL, G, exec, ~/.config/hypr/scripts/toggle-scratchpad.sh display --stack

# Scratchpad Anchor Lock & HUD Pin (Super+Y and Super+Shift+P)
bind = $mod, Y, exec, ~/.config/hypr/scripts/toggle-anchor.sh
bind = $mod SHIFT, P, exec, ~/.config/hypr/scripts/toggle-anchor.sh


# Media Controls
bind = , XF86AudioPlay, exec, ~/.config/hypr/scripts/osd.sh play
bind = , XF86AudioNext, exec, ~/.config/hypr/scripts/osd.sh next
bind = , XF86AudioPrev, exec, ~/.config/hypr/scripts/osd.sh prev

# Volume & Brightness
binde = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/osd.sh vol-up
binde = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/osd.sh vol-down
bind = , XF86AudioMute, exec, ~/.config/hypr/scripts/osd.sh vol-mute
binde = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Delete Key (60% Keyboard: Super + Backspace -> Del)
binde = $mod, Backspace, sendshortcut, , Delete, activewindow
binde = $mod SHIFT, Backspace, sendshortcut, SHIFT, Delete, activewindow

# Notification Controls (Dismiss)
bind = $mod, N, exec, dunstctl close
bind = $mod SHIFT, N, exec, dunstctl close-all

# Screenshot
bind = $mod, P, exec, ~/.config/hypr/scripts/screenshot.sh
bind = $mod ALT, P, exec, ~/.config/hypr/scripts/screenshot-ocr.sh
bind = $mod SHIFT, S, exec, ~/.config/hypr/scripts/screenshot-ocr.sh

# Mouse binds
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Laptop Lid Switch (Clamshell / Insomnia Mode)
bindl = , switch:on:Lid Switch, exec, bash ~/.config/hypr/scripts/lid-handler.sh close
bindl = , switch:off:Lid Switch, exec, bash ~/.config/hypr/scripts/lid-handler.sh open

# ┌─────────────────────────────────────────────────────────────┐
# │ 11. MISC (その他)                                           │
# └─────────────────────────────────────────────────────────────┘
misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    focus_on_activate = false
    mouse_move_enables_dpms = false
    key_press_enables_dpms = true
}




# ┌─────────────────────────────────────────────────────────────┐
# │ NEW WINDOW RULES (0.56 SYNTAX)                              │
# └─────────────────────────────────────────────────────────────┘
windowrule = match:class .*, suppress_event maximize
windowrule = match:class ^([Ss]potify)$, workspace special:music silent
windowrule = match:class ^([Vv]esktop)$, workspace special:discord silent
windowrule = match:class ^(notes-term)$, workspace special:notes silent
windowrule = match:class ^(com\.github\.hluk\.copyq)$, workspace special:notes silent
windowrule = match:class ^(vivaldi-calendar\.notion\.so.*)$, workspace special:calendar silent
windowrule = match:class ^(com\.tokyo\.commandcenter|command-center)$, workspace special:center silent
windowrule = match:class ^(com\.tokyo\.radar)$, workspace special:radar silent
windowrule = match:class ^(com\.tokyo\.displaydeck)$, workspace special:display silent
windowrule = match:class ^(crt-blink)$, float 1, fullscreen 1

workspace = special:display, gapsout:0, gapsin:0, border:false
workspace = special:antigravity, gapsout:0, gapsin:0, border:false
workspace = special:dev, gapsout:0, gapsin:0, border:false
windowrule = match:class ^(antigravity-ide)$, workspace special:dev silent
windowrule = match:class ^(vivaldi-localhost.*)$, workspace special:dev silent
windowrule = match:class ^(antigravity)$, workspace special:antigravity silent

windowrule = match:class ^(trv30-cava)$, workspace special:cava silent
workspace = special:cava, gapsout:60, monitor:eDP-1
windowrule = match:class ^(trv30-btop)$, workspace special:sysmon silent
workspace = special:sysmon, gapsout:60, monitor:eDP-1


xwayland {
    force_zero_scaling = true
}

# Disable earbud in-ear detection / AVRCP keyboard events
device {
    name = earfun-air-pro-4-(avrcp)
    enabled = false
}
